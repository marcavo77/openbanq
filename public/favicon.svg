<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="obGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="obBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="obGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Sleek Dark Rounded Background -->
  <rect width="100" height="100" rx="24" fill="url(#obBg)" />
  <rect width="98" height="98" x="1" y="1" rx="23" fill="none" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2" />
  
  <!-- Outer 'O' with Open Aperture (Emerald to Cyan Gradient) -->
  <path d="M 50 18 C 32 18 20 31 20 49 C 20 67 32 80 50 80 C 67 80 79 67 80 50" 
        fill="none" 
        stroke="url(#obGradient)" 
        stroke-width="8" 
        stroke-linecap="round" 
        filter="url(#obGlow)" />
        
  <!-- Beacon / Pulse Dot at the Open Portal -->
  <circle cx="76" cy="24" r="5" fill="#34d399" />
  
  <!-- Inner Modern 'B' in Pristine White -->
  <path d="M 40 33 L 40 65 M 40 33 H 53 C 59.5 33 63.5 36.5 63.5 41.5 C 63.5 46 59.5 49 53 49 H 40 M 40 49 H 55 C 62 49 65.5 52 65.5 57 C 65.5 62.5 61.5 65 55 65 H 40" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
