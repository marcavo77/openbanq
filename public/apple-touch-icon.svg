<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="obGradientApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="obBgApple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="obGlowApple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Apple Touch Rounded Corner Background -->
  <rect width="180" height="180" rx="42" fill="url(#obBgApple)" />
  <rect width="176" height="176" x="2" y="2" rx="40" fill="none" stroke="rgba(52, 211, 153, 0.3)" stroke-width="3" />
  
  <g transform="scale(1.8) translate(0, 0)">
    <!-- Outer 'O' with Open Aperture (Emerald to Cyan Gradient) -->
    <path d="M 50 18 C 32 18 20 31 20 49 C 20 67 32 80 50 80 C 67 80 79 67 80 50" 
          fill="none" 
          stroke="url(#obGradientApple)" 
          stroke-width="8" 
          stroke-linecap="round" 
          filter="url(#obGlowApple)" />
          
    <!-- Beacon / Pulse Dot at the Open Portal -->
    <circle cx="76" cy="24" r="5" fill="#34d399" />
    
    <!-- Inner Modern 'B' in Pristine White -->
    <path d="M 40 33 L 40 65 M 40 33 H 53 C 59.5 33 63.5 36.5 63.5 41.5 C 63.5 46 59.5 49 53 49 H 40 M 40 49 H 55 C 62 49 65.5 52 65.5 57 C 65.5 62.5 61.5 65 55 65 H 40" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
